server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index Archivo_de_Planos_Históricos.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reenvía las llamadas del front a la API (servicio "api" del docker-compose).
    # Así el JS llama a rutas relativas (/api/...) y evita problemas de CORS.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Los planos escaneados pueden pesar varios MB
    client_max_body_size 20M;

    # Sin caché mientras desarrollás, así ves los cambios del HTML al recargar
    add_header Cache-Control "no-cache";
}
