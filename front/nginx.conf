server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reenvía las llamadas del front a la API (servicio "api" del docker-compose).
    # Así el JS llama a rutas relativas (/api/...) y evita problemas de CORS.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Los planos escaneados pueden pesar varios MB
    client_max_body_size 20M;

    # Sin caché mientras desarrollás, así ves los cambios del HTML al recargar
    add_header Cache-Control "no-cache";
}
