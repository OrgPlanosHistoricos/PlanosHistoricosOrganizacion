services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["local-ai"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Si tenés GPU NVIDIA y el nvidia-container-toolkit instalado,
    # descomentá lo siguiente para acelerar la inferencia:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        until ollama list > /dev/null 2>&1; do
          echo 'Esperando a Ollama...'; sleep 2;
        done &&
        ollama pull qwen2.5vl:3b
      "
    environment:
      - OLLAMA_HOST=ollama:11434

  api:
    build: ./backend
    container_name: planos-api
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      # Postgres de Supabase (session pooler); el esquema tramitacion se carga a mano desde db/tramitacion
      - DATABASE_URL=${SUPABASE_DB_URL}
      - LOCALIDAD_PLANOS=${LOCALIDAD_PLANOS:-LP}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - VISION_MODEL=${VISION_MODEL:-qwen2.5vl:3b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-300}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-planos_escaneados}
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./.env:/app/.env:ro
    ports:
      - "8000:8000"

  front:
    image: nginx:alpine
    container_name: planos-front
    depends_on:
      - api
    volumes:
      - ./front:/usr/share/nginx/html:ro
      - ./front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  ollama_data:
