services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Si tenés GPU NVIDIA y el nvidia-container-toolkit instalado,
    # descomentá lo siguiente para acelerar la inferencia:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        until ollama --host ollama:11434 list > /dev/null 2>&1; do
          echo 'Esperando a Ollama...'; sleep 2;
        done &&
        ollama --host ollama:11434 pull qwen2.5vl:3b
      "
    environment:
      - OLLAMA_HOST=ollama:11434

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web

  api:
    build: .
    container_name: planos-api
    depends_on:
      - ollama
      - ollama-pull
      - minio
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - VISION_MODEL=qwen2.5vl:3b
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=planos
      - MINIO_SECURE=false
    ports:
      - "8000:8000"

  front:
    image: nginx:alpine
    container_name: planos-front
    depends_on:
      - api
    volumes:
      - ./front:/usr/share/nginx/html:ro
      - ./front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  ollama_data:
  minio_data: