services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Si tenés GPU NVIDIA y el nvidia-container-toolkit instalado,
    # descomentá lo siguiente para acelerar la inferencia:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    entrypoint: >
      sh -c "
        until ollama list > /dev/null 2>&1; do
          echo 'Esperando a Ollama...'; sleep 2;
        done &&
        ollama pull qwen3-vl:4b
      "
    environment:
      - OLLAMA_HOST=ollama:11434

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web

  postgres:
    image: postgres:16-alpine
    container_name: planos-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-planos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-planos}
      - POSTGRES_DB=${POSTGRES_DB:-planos_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: planos-api
    depends_on:
      ollama:
        condition: service_started
      ollama-pull:
        condition: service_started
      minio:
        condition: service_started
      # La API crea las tablas al arrancar, así que necesita Postgres aceptando conexiones
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-planos}:${POSTGRES_PASSWORD:-planos}@postgres:5432/${POSTGRES_DB:-planos_db}
      - OLLAMA_HOST=http://ollama:11434
      - VISION_MODEL=qwen3-vl:4b
      - OLLAMA_TIMEOUT=300
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=planos
      - MINIO_SECURE=false
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - MONGODB_URI=${MONGODB_URI}
    volumes:
      - ./api:/app/api
    ports:
      - "8000:8000"

  front:
    image: nginx:alpine
    container_name: planos-front
    depends_on:
      - api
    volumes:
      - ./front:/usr/share/nginx/html:ro
      - ./front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  ollama_data:
  minio_data:
  postgres_data: